<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Einrichtung · {{ brand }}</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth">
    <header class="auth-head">
      <div class="auth-brand">{{ brand }}</div>
      <h1 class="auth-title">Willkommen</h1>
      <p class="auth-sub">Lege das Administrator-Konto an. Danach verbindest du Hosts, Proxmox und weitere Dienste Schritt für Schritt.</p>
    </header>

    <form class="auth-form" action="/setup" method="POST" id="auth-form">
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" value="admin" required autofocus autocomplete="username"
               autocapitalize="none" spellcheck="false" pattern="[a-z0-9._\-]{2,32}">
      </div>
      <div class="field">
        <label for="password">Passwort <span style="color:var(--text-mute)">· mindestens 10 Zeichen</span></label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" minlength="10" required autocomplete="new-password">
          <button type="button" class="reveal" id="reveal" aria-controls="password" aria-pressed="false">Anzeigen</button>
        </div>
      </div>
      <div class="field">
        <label for="password2">Passwort wiederholen</label>
        <input type="password" id="password2" name="password2" minlength="10" required autocomplete="new-password">
        <div class="hint" id="mismatch" hidden>Die Passwörter stimmen nicht überein.</div>
      </div>
      <button type="submit" class="btn" id="submit">Konto anlegen</button>
    </form>

    <footer class="auth-foot">Diese Seite erscheint nur, solange noch kein Konto existiert.</footer>
  </main>

  <script>
    (function () {
      var pw = document.getElementById('password'), pw2 = document.getElementById('password2');
      var rv = document.getElementById('reveal'), mm = document.getElementById('mismatch');
      rv.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = pw2.type = show ? 'text' : 'password';
        rv.textContent = show ? 'Verbergen' : 'Anzeigen';
        rv.setAttribute('aria-pressed', show ? 'true' : 'false');
      });
      function check() { mm.hidden = !pw2.value || pw.value === pw2.value; }
      pw.addEventListener('input', check); pw2.addEventListener('input', check);
      var f = document.getElementById('auth-form'), b = document.getElementById('submit');
      f.addEventListener('submit', function (e) {
        if (pw.value !== pw2.value) { e.preventDefault(); mm.hidden = false; pw2.focus(); return; }
        b.disabled = true; b.textContent = 'Einen Moment …';
      });
    })();
  </script>
</body>
</html>
